name: build-windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build one-folder app
        run: >
          pyinstaller --noconfirm --clean --onedir --windowed
          --name ConsumerGuard
          --add-data "kb_seed;kb_seed"
          --collect-data customtkinter
          main.py

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = (Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $iscc) { $iscc = (Get-Command iscc.exe -ErrorAction Stop).Source }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: ConsumerGuard_Setup
          path: Output/ConsumerGuard_Setup.exe
          if-no-files-found: error
